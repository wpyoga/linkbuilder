<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ data.title }}</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
        margin: 0;
        min-height: 100vh;
        box-sizing: border-box;
      }
      .container {
        width: 100%;
        max-width: 480px;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.25rem;
      }
      p.bio {
        color: #94a3b8;
        font-size: 0.95rem;
        margin-bottom: 2rem;
      }
      .btn {
        display: block;
        background: #1e293b;
        color: #f8fafc;
        text-decoration: none;
        padding: 14px 20px;
        border-radius: 12px;
        margin-bottom: 12px;
        font-weight: 500;
        border: 1px solid #334155;
        transition:
          background 0.2s,
          transform 0.1s;
      }
      .btn:hover {
        background: #334155;
        transform: translateY(-1px);
      }
      .btn-vcard {
        background: #0284c7;
        border-color: #0369a1;
        margin-bottom: 1.5rem;
      }
      .btn-vcard:hover {
        background: #0369a1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>{{ data.title }}</h1>
      <p class="bio">{{ data.bio }}</p>

      <!-- Pure relative path to physical file generated by script -->
      <a href="{{ data.vcard_relative_path }}" class="vcard-button" download
        >Save Contact</a
      >

      {% for link in data.links %}
      <a href="{{ link.url }}" class="btn" target="_blank" rel="noopener"
        >{{ link.label }}</a
      >
      {% endfor %}
    </div>
  </body>
</html>
