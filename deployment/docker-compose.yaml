services:
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    environment:
      - DB_PATH=/app/data/app.db
      - OUTPUT_DIR=/app/pub
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}
    volumes:
      - db_data:/app/data
      - ./pub:/app/pub
    ports:
      - 5000:8000

volumes:
  db_data:
