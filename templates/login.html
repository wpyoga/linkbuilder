<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Login</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 360px;
      }
      h2 {
        margin-top: 0;
        color: #1e293b;
        text-align: center;
      }
      label {
        font-weight: bold;
        display: block;
        margin-top: 15px;
        font-size: 0.9rem;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        width: 100%;
        background: #0066cc;
        color: #fff;
        border: none;
        padding: 12px;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 20px;
      }
      button:hover {
        background: #0052a3;
      }
      .alert {
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 15px;
        font-size: 0.85rem;
      }
      .alert-danger {
        background: #f8d7da;
        color: #721c24;
      }
      .alert-success {
        background: #d4edda;
        color: #155724;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>System Login</h2>

      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %} {% endif %} {% endwith %}

      <form action="/login" method="POST">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          required
          autofocus
          autocomplete="username"
        />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="current-password"
        />

        <button type="submit">Sign In</button>
      </form>
    </div>
  </body>
</html>
